<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonify</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <h1>SONIFY</h1>
    <div id="conn" class="conn" role="status" data-state="connecting">
      <span class="dot" aria-hidden="true"></span><span id="conn-text">Connecting</span>
    </div>
    <div class="master">
      <label for="master-vol">Volume</label>
      <input id="master-vol" type="range" min="0" max="1" step="0.01" value="0.7">
      <output id="master-out" for="master-vol">70%</output>
      <button id="mute-btn" type="button" aria-pressed="false">Mute</button>
    </div>
  </header>

  <main id="main">
    <section aria-labelledby="h-signals">
      <h2 id="h-signals">Signals</h2>
      <div id="tiles" class="tiles"></div>
    </section>

    <div class="cols">
      <section class="panel" aria-labelledby="h-timeline">
        <h2 id="h-timeline">Timeline</h2>
        <div class="filters">
          <label>Sound <select id="f-sound"><option value="">all</option></select></label>
          <label>Signal <select id="f-signal"><option value="">all</option></select></label>
          <label class="check"><input id="f-suppressed" type="checkbox"> Show suppressed</label>
        </div>
        <ol id="timeline" class="timeline" tabindex="0" aria-label="Sound events, newest first"></ol>
      </section>

      <section class="panel" aria-labelledby="h-mixer">
        <h2 id="h-mixer">Mixer</h2>
        <p class="hint">Live tweaks. They apply now but are not saved to config.yaml.</p>
        <div id="mixer" class="mixer"></div>
      </section>
    </div>

    <section class="panel" aria-labelledby="h-editor">
      <h2 id="h-editor">Mapping editor</h2>
      <form id="editor" novalidate></form>
    </section>
  </main>

  <div id="sr-live" class="sr-only" aria-live="polite"></div>
</body>
</html>
