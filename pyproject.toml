[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minecraft-sonify"
version = "0.1.1"
description = "Turn system metrics into ambient Minecraft sound effects."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Ayaan Shaikh" }]
keywords = ["minecraft", "sonification", "monitoring", "ambient", "psutil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "numpy>=1.26",
    "psutil>=5.9",
    "pydantic>=2.5",
    "pygame-ce>=2.5.2",
    "PyYAML>=6.0",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sonify = "sonify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
