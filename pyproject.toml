[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonify"
version = "0.1.0"
description = "Turn system metrics into ambient Minecraft sound effects."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "numpy>=1.26",
    "psutil>=5.9",
    "pydantic>=2.5",
    "pygame-ce>=2.5.2",
    "PyYAML>=6.0",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sonify = "sonify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
